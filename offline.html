<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6c63ff">
    <title>SkyPulse - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        
        p {
            color: #cbd5e0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #5a52e0;
            transform: translateY(-2px);
        }
        
        .retry-icon {
            margin-right: 8px;
        }
        
        @media (max-width: 600px) {
            .icon {
                font-size: 60px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            button {
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🌐</div>
        <h1>You're Offline</h1>
        <p>Please check your internet connection to get the latest weather updates. SkyPulse will automatically reconnect when you're back online.</p>
        <button onclick="location.reload()">
            <span class="retry-icon">🔄</span>
            Retry Connection
        </button>
    </div>
</body>
</html>
