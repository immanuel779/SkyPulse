<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SkyPulse - Professional weather app with real-time conditions, 7-day forecast, and offline support. Get accurate weather data for any location worldwide.">
    <meta name="theme-color" content="#6c63ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SkyPulse">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="SkyPulse Weather App">
    <meta property="og:description" content="Professional weather app with real-time conditions and 7-day forecast">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icons/icon-512x512.png">
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="icons/icon-96x96.png">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    <link rel="manifest" href="manifest.json">
    
    <title>SkyPulse | Professional Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Skip to main content for accessibility -->
    <a href="#main" class="skip-link">Skip to main content</a>
    
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3V4M12 20V21M4 12H3M6.5 6.5L5.5 5.5M17.5 6.5L18.5 5.5M21 12H20M17.5 17.5L18.5 18.5M6.5 17.5L5.5 18.5M12 7C9.24 7 7 9.24 7 12C7 14.76 9.24 17 12 17C14.76 17 17 14.76 17 12C17 9.24 14.76 7 12 7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <h1>SkyPulse <span class="version">v2.0</span></h1>
            </div>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light mode">
                <span class="theme-icon">🌙</span>
            </button>
        </header>
        
        <!-- Search Section -->
        <form id="searchForm" class="search-form" role="search">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    id="cityInput" 
                    class="search-input" 
                    placeholder="Enter city name..."
                    aria-label="Search for a city"
                    autocomplete="off"
                >
                <button type="submit" id="searchBtn" class="search-btn" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M21 21L16.5 16.5M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <button type="button" id="locationBtn" class="location-btn" aria-label="Use my current location">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2V4M12 20V22M4 12H2M6.5 6.5L5.5 5.5M17.5 6.5L18.5 5.5M22 12H20M17.5 17.5L18.5 18.5M6.5 17.5L5.5 18.5M12 7C9.24 7 7 9.24 7 12C7 14.76 9.24 17 12 17C14.76 17 17 14.76 17 12C17 9.24 14.76 7 12 7Z" stroke="currentColor" stroke-width="1.5"/>
                </svg>
            </button>
        </form>
        
        <!-- Search History -->
        <div id="history" class="history" aria-label="Search history"></div>
        
        <!-- Loading & Error States -->
        <div id="loader" class="loader hidden" role="status" aria-label="Loading weather data">
            <div class="spinner"></div>
            <span class="sr-only">Loading...</span>
        </div>
        <div id="error" class="error-message hidden" role="alert"></div>
        
        <!-- Main Content -->
        <main id="main">
            <!-- Weather Card -->
            <div id="weatherCard" class="weather-card hidden">
                <div class="weather-header">
                    <h2 id="cityName" class="city-name"></h2>
                    <div id="lastUpdated" class="last-updated"></div>
                </div>
                
                <div class="weather-main">
                    <img id="weatherIcon" class="weather-icon" alt="" width="100" height="100">
                    <div class="temperature-section">
                        <span id="temperature" class="temperature"></span>
                        <span class="temperature-unit">°C</span>
                    </div>
                    <p id="description" class="weather-description"></p>
                </div>
                
                <div class="weather-details">
                    <div class="detail-card">
                        <span class="detail-icon">💧</span>
                        <div>
                            <span class="detail-label">Humidity</span>
                            <span id="humidity" class="detail-value">--%</span>
                        </div>
                    </div>
                    <div class="detail-card">
                        <span class="detail-icon">🌬️</span>
                        <div>
                            <span class="detail-label">Wind Speed</span>
                            <span id="wind" class="detail-value">-- km/h</span>
                        </div>
                    </div>
                    <div class="detail-card">
                        <span class="detail-icon">🌡️</span>
                        <div>
                            <span class="detail-label">Pressure</span>
                            <span id="pressure" class="detail-value">-- hPa</span>
                        </div>
                    </div>
                    <div class="detail-card">
                        <span class="detail-icon">👁️</span>
                        <div>
                            <span class="detail-label">Feels Like</span>
                            <span id="feelsLike" class="detail-value">--°C</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Forecast Section -->
            <div class="forecast-section">
                <h3 class="forecast-title">7-Day Forecast</h3>
                <div id="forecast" class="forecast-grid"></div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer>
            <p>&copy; 2026 SkyPulse.</p>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
